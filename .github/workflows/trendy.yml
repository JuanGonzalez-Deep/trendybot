name: Vigilar Trendy

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  vigilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Diagnostico
        run: |
          echo "BOT_TOKEN: ${#BOT_TOKEN} caracteres"
          echo "CHAT_IDS: ${#CHAT_IDS} caracteres"
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_IDS: ${{ secrets.CHAT_IDS }}

      - id: bot
        run: python trendy_bot.py --once
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_IDS: ${{ secrets.CHAT_IDS }}
          TRENDY_URL: "https://www.maquillajetrendyshop.com/"

      - if: steps.bot.outputs.found == 'true'
        run: gh workflow disable "Vigilar Trendy"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
